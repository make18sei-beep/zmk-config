# GitHub Actions build matrix.
# right = central (connects to the PC). ZMK Studio is enabled on the central only.
# settings_reset is for clearing BLE pairing info when the halves stop finding each other.
---
include:
  - board: seeeduino_xiao_ble
    shield: sora46_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: seeeduino_xiao_ble
    shield: sora46_left
  - board: seeeduino_xiao_ble
    shield: settings_reset
